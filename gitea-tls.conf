server {
    listen 3443 ssl;
    server_name gitea;
    ssl_certificate /etc/nginx/certs/gitea.crt;
    ssl_certificate_key /etc/nginx/certs/gitea.key;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
