apiVersion: v1
kind: Service
metadata:
  name: echo-app
spec:
  selector:
    app: echo-app
  ports:
    - port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: echo-app-stable
spec:
  selector:
    app: echo-app
  ports:
    - port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: echo-app-canary
spec:
  selector:
    app: echo-app
  ports:
    - port: 80
      targetPort: http
