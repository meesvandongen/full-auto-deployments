apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: echo-app-check
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  metrics:
    - name: behavior
      count: 3
      interval: 3s
      successCondition: result.ok == true
      failureLimit: 0
      provider:
        web:
          url: http://echo-app-canary.{{ .Release.Namespace }}.svc.cluster.local/check
          jsonPath: "{$}"
    - name: canary-gauge
      initialDelay: 20s
      count: 3
      interval: 5s
      successCondition: len(result) == 1 && result[0] == 1
      failureLimit: 0
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local
          query: 'echo_check_success{job="{{ .Release.Namespace }}-canary",version="{{ .Values.image.tag }}"}'
    - name: synthetic-traffic
      count: 1
      successCondition: result.exitCode == 0
      failureCondition: result.exitCode != 0
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: testkube
                    image: kubeshop/testkube-cli:2.15.3
                    env:
                      - name: DO_NOT_TRACK
                        value: "1"
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        testkube --client direct \
                          --api-uri http://testkube-api-server.testkube.svc.cluster.local:8088 \
                          --namespace testkube run testworkflow echo-app-load \
                          --config target=http://echo-app-canary.{{ .Release.Namespace }}.svc.cluster.local \
                          --config revision={{ .Values.tests.revision }} \
                          --watch
