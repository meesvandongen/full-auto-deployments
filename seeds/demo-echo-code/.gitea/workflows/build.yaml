name: build-echo-and-publish
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: docker:27-cli
    steps:
      - name: Test, build and publish immutable image
        env:
          COMMIT_SHA: ${{ gitea.sha }}
          RUN_NUMBER: ${{ gitea.run_number }}
        run: |
          set -euo pipefail
          git clone http://gitea:3000/demo/demo-echo-code.git /tmp/source
          cd /tmp/source
          git checkout "$COMMIT_SHA"
          tag="$(printf 'echo-%08d-%s' "$RUN_NUMBER" "$COMMIT_SHA")"
          image="localhost:5001/demo-echo-code:$tag"
          docker build --target test .
          docker build --target k6-test -t "local/k6-test:$tag" .
          docker build --build-arg "VERSION=$tag" -t "$image" .
          container="$(docker run -d --rm --name "ci-$tag" --network full-auto "$image")"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec "$container" python -c 'from urllib.request import urlopen; urlopen("http://127.0.0.1:8080/readyz")' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Application did not become ready" >&2
            exit 1
          fi
          docker exec "$container" python -c 'from urllib.request import urlopen; print(urlopen("http://127.0.0.1:8080/metrics").read().decode(), end="")' |
            docker run --rm -i --entrypoint promtool quay.io/prometheus/prometheus:v3.16.0 check metrics
          docker run --rm --network full-auto --entrypoint k6 \
            -e "TARGET_URL=http://ci-$tag:8080" "local/k6-test:$tag" run load.js
          docker build --target pact-test -t "local/pact-consumer:$tag" .
          pact_container="$(docker create "local/pact-consumer:$tag")"
          docker start -a "$pact_container"
          mkdir -p pacts
          docker cp "$pact_container:/tmp/pacts/." pacts/
          docker rm "$pact_container"
          publisher="$(docker create --network full-auto \
            -e PACT_BROKER_BASE_URL=http://k3d-full-auto-server-0:30929 \
            pactfoundation/pact-cli@sha256:328565c63fcd516c91ab9a3787231424e55ba22c05b082ab648dd67d841b47d9 \
            pact-broker publish /pacts \
            --consumer-app-version "$COMMIT_SHA" --branch main)"
          docker cp pacts "$publisher:/pacts"
          docker start -a "$publisher"
          docker rm "$publisher"
          git clone http://gitea:3000/demo/demo-app-code.git /tmp/provider
          cd /tmp/provider
          PACT_BROKER_BASE_URL=http://k3d-full-auto-server-0:30929 sh pact/verify-provider.sh
          cd /tmp/source
          docker push "$image"
