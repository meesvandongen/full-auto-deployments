apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-delivery
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://gitea:3443/demo/delivery-config.git
    targetRevision: main
    path: demo/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
