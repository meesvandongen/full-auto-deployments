apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: echo-app-load
  namespace: testkube
spec:
  config:
    target:
      type: string
    revision:
      type: string
  content:
    git:
      uri: http://gitea:3000/demo/demo-echo-code.git
      revision: "{{ config.revision }}"
      paths:
        - tests/load.js
  container:
    workingDir: /data/repo/tests
  steps:
    - name: Generate synthetic traffic
      run:
        image: grafana/k6:0.49.0
        env:
          - name: TARGET_URL
            value: "{{ config.target }}"
        shell: k6 run load.js
