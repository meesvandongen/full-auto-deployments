apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: echo
  namespace: echo
spec:
  promotionPolicies:
    - stageSelector:
        name: dev
      autoPromotionEnabled: true
    - stageSelector:
        name: prod
      autoPromotionEnabled: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: echo-app
  namespace: echo
spec:
  subscriptions:
    - image:
        repoURL: registry:5443/demo-echo-code
        imageSelectionStrategy: Lexical
        insecureSkipTLSVerify: true
        allowTagsRegexes:
          - ^echo-[0-9]{8}-[0-9a-f]{40}$
        discoveryLimit: 5
    - git:
        repoURL: https://gitea:3443/demo/demo-echo-chart.git
        branch: main
        insecureSkipTLSVerify: true
    - git:
        repoURL: https://gitea:3443/demo/demo-echo-code.git
        branch: main
        insecureSkipTLSVerify: true
  freightCreationCriteria:
    expression: |
      hasSuffix(imageFrom('registry:5443/demo-echo-code').Tag, commitFrom('https://gitea:3443/demo/demo-echo-code.git').ID)
---
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: deploy-echo
  namespace: echo
spec:
  vars:
    - name: gitopsRepo
      value: https://gitea:3443/demo/demo-echo-chart.git
    - name: imageRepo
      value: registry:5443/demo-echo-code
    - name: codeRepo
      value: https://gitea:3443/demo/demo-echo-code.git
  steps:
    - uses: http
      config:
        url: http://pact-broker.pact.svc.cluster.local/matrix
        queryParams:
          - name: q[][pacticipant]
            value: echo-app
          - name: q[][version]
            value: ${{ commitFrom(vars.codeRepo).ID }}
          - name: environment
            value: ${{ ctx.stage }}
          - name: latestby
            value: cvpv
        successExpression: response.status == 200 && response.body.summary.deployable == true
        failureExpression: response.status != 200 || response.body.summary.deployable != true
        errorExpression: response.body.summary?.reason
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitopsRepo }}
        insecureSkipTLSVerify: true
        checkout:
          - commit: ${{ commitFrom(vars.gitopsRepo).ID }}
            path: ./src
          - branch: stage/${{ ctx.stage }}
            create: true
            path: ./out
    - uses: git-clear
      config:
        path: ./out
    - uses: copy
      config:
        inPath: ./src/chart
        outPath: ./out/chart
    - uses: yaml-update
      config:
        path: ./out/chart/values.yaml
        updates:
          - key: image.tag
            value: ${{ imageFrom(vars.imageRepo).Tag }}
          - key: image.digest
            value: ${{ imageFrom(vars.imageRepo).Digest }}
          - key: tests.revision
            value: ${{ commitFrom(vars.codeRepo).ID }}
          - key: double.url
            value: http://demo-app.demo-${{ ctx.stage }}.svc.cluster.local
    - uses: git-commit
      as: commit
      config:
        path: ./out
        message: Promote echo-app to ${{ ctx.stage }}
    - uses: git-push
      config:
        path: ./out
    - uses: argocd-update
      config:
        apps:
          - name: echo-${{ ctx.stage }}
            sources:
              - repoURL: ${{ vars.gitopsRepo }}
                desiredRevision: ${{ task.outputs.commit.commit }}
    - uses: argocd-wait
      config:
        apps:
          - name: echo-${{ ctx.stage }}
    - uses: http
      as: deployment-link
      config:
        url: http://pact-broker.pact.svc.cluster.local/pacticipants/echo-app/versions/${{ commitFrom(vars.codeRepo).ID }}
        successExpression: response.status == 200
        failureExpression: response.status != 200
        outputs:
          - name: href
            fromExpression: find(response.body._links["pb:record-deployment"], {#.name == "${{ ctx.stage }}"}).href
    - uses: http
      config:
        method: POST
        url: ${{ task.outputs['deployment-link'].href }}
        headers:
          - name: Content-Type
            value: application/json
        body: "{}"
        successExpression: response.status == 201 || response.status == 200
        failureExpression: response.status != 201 && response.status != 200
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: stage-check
  namespace: echo
spec:
  args:
    - name: url
    - name: base-url
    - name: revision
  metrics:
    - name: behavior
      count: 3
      interval: 3s
      successCondition: result == "hello World"
      failureLimit: 0
      provider:
        web:
          url: "{{ args.url }}"
          jsonPath: "{$.message}"
    - name: double-dependency
      count: 1
      successCondition: result == 14
      failureLimit: 0
      provider:
        web:
          url: "{{ args.base-url }}/api/greet?name=World&value=7"
          jsonPath: "{$.doubled}"
    - name: synthetic-traffic
      count: 1
      successCondition: result.exitCode == 0
      failureCondition: result.exitCode != 0
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: testkube
                    image: kubeshop/testkube-cli:2.15.3
                    env:
                      - name: DO_NOT_TRACK
                        value: "1"
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        testkube --client direct \
                          --api-uri http://testkube-api-server.testkube.svc.cluster.local:8088 \
                          --namespace testkube run testworkflow echo-app-load \
                          --config "target={{ args.base-url }}" \
                          --config "revision={{ args.revision }}" --watch
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: echo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: echo-app
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - task:
            name: deploy-echo
  verification:
    analysisTemplates:
      - name: stage-check
    args:
      - name: url
        value: http://echo-app.echo-dev.svc.cluster.local/api/greet?name=World
      - name: base-url
        value: http://echo-app.echo-dev.svc.cluster.local
      - name: revision
        value: ${{ commitFrom("https://gitea:3443/demo/demo-echo-code.git").ID }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: echo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: echo-app
      sources:
        stages:
          - dev
        autoPromotionOptions:
          selectionPolicy: MatchUpstream
  promotionTemplate:
    spec:
      steps:
        - task:
            name: deploy-echo
  verification:
    analysisTemplates:
      - name: stage-check
    args:
      - name: url
        value: http://echo-app.echo-prod.svc.cluster.local/api/greet?name=World
      - name: base-url
        value: http://echo-app.echo-prod.svc.cluster.local
      - name: revision
        value: ${{ commitFrom("https://gitea:3443/demo/demo-echo-code.git").ID }}
