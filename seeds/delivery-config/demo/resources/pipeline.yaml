apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: demo
  namespace: demo
spec:
  promotionPolicies:
    - stageSelector:
        name: dev
      autoPromotionEnabled: true
    - stageSelector:
        name: prod
      autoPromotionEnabled: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: demo-app
  namespace: demo
spec:
  subscriptions:
    - image:
        repoURL: registry:5443/demo-app-code
        imageSelectionStrategy: Lexical
        insecureSkipTLSVerify: true
        allowTagsRegexes:
          - ^app-[0-9]{8}-[0-9a-f]{40}$
        discoveryLimit: 5
    - git:
        repoURL: https://gitea:3443/demo/demo-app-chart.git
        branch: main
        insecureSkipTLSVerify: true
    - git:
        repoURL: https://gitea:3443/demo/demo-app-code.git
        branch: main
        insecureSkipTLSVerify: true
  freightCreationCriteria:
    expression: |
      hasSuffix(imageFrom('registry:5443/demo-app-code').Tag, commitFrom('https://gitea:3443/demo/demo-app-code.git').ID)
---
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: deploy-app
  namespace: demo
spec:
  vars:
    - name: gitopsRepo
      value: https://gitea:3443/demo/demo-app-chart.git
    - name: imageRepo
      value: registry:5443/demo-app-code
    - name: codeRepo
      value: https://gitea:3443/demo/demo-app-code.git
  steps:
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitopsRepo }}
        insecureSkipTLSVerify: true
        checkout:
          - commit: ${{ commitFrom(vars.gitopsRepo).ID }}
            path: ./src
          - branch: stage/${{ ctx.stage }}
            create: true
            path: ./out
    - uses: git-clear
      config:
        path: ./out
    - uses: copy
      config:
        inPath: ./src/chart
        outPath: ./out/chart
    - uses: yaml-update
      config:
        path: ./out/chart/values.yaml
        updates:
          - key: image.tag
            value: ${{ imageFrom(vars.imageRepo).Tag }}
          - key: image.digest
            value: ${{ imageFrom(vars.imageRepo).Digest }}
          - key: tests.revision
            value: ${{ commitFrom(vars.codeRepo).ID }}
    - uses: git-commit
      as: commit
      config:
        path: ./out
        message: Promote demo-app to ${{ ctx.stage }}
    - uses: git-push
      config:
        path: ./out
    - uses: argocd-update
      config:
        apps:
          - name: demo-${{ ctx.stage }}
            sources:
              - repoURL: ${{ vars.gitopsRepo }}
                desiredRevision: ${{ task.outputs.commit.commit }}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: stage-check
  namespace: demo
spec:
  args:
    - name: url
    - name: base-url
    - name: revision
  metrics:
    - name: behavior
      count: 3
      interval: 3s
      successCondition: result == 42
      failureLimit: 0
      provider:
        web:
          url: "{{ args.url }}"
          jsonPath: "{$.result}"
    - name: synthetic-traffic
      count: 1
      successCondition: result.exitCode == 0
      failureCondition: result.exitCode != 0
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: testkube
                    image: kubeshop/testkube-cli:2.15.3
                    env:
                      - name: DO_NOT_TRACK
                        value: "1"
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        testkube --client direct \
                          --api-uri http://testkube-api-server.testkube.svc.cluster.local:8088 \
                          --namespace testkube run testworkflow demo-app-load \
                          --config "target={{ args.base-url }}" \
                          --config "revision={{ args.revision }}" --watch
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: demo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: demo-app
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - task:
            name: deploy-app
  verification:
    analysisTemplates:
      - name: stage-check
    args:
      - name: url
        value: http://demo-app.demo-dev.svc.cluster.local/api/double?value=21
      - name: base-url
        value: http://demo-app.demo-dev.svc.cluster.local
      - name: revision
        value: ${{ commitFrom("https://gitea:3443/demo/demo-app-code.git").ID }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: demo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: demo-app
      sources:
        stages:
          - dev
        autoPromotionOptions:
          selectionPolicy: MatchUpstream
  promotionTemplate:
    spec:
      steps:
        - task:
            name: deploy-app
  verification:
    analysisTemplates:
      - name: stage-check
    args:
      - name: url
        value: http://demo-app.demo-prod.svc.cluster.local/api/double?value=21
      - name: base-url
        value: http://demo-app.demo-prod.svc.cluster.local
      - name: revision
        value: ${{ commitFrom("https://gitea:3443/demo/demo-app-code.git").ID }}
