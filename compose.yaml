services:
  gitea:
    image: docker.io/gitea/gitea:1.25.5
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__actions__ENABLED: "true"
      GITEA__repository__DEFAULT_REPO_UNITS: repo.code,repo.releases,repo.issues,repo.pulls,repo.actions
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN:?Run scripts/up.sh first}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - gitea-data:/data
    networks:
      - local
    restart: unless-stopped

  registry:
    image: docker.io/library/registry:2
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - local
    restart: unless-stopped

  registry-tls:
    image: docker.io/library/nginx:1.29-alpine
    network_mode: service:registry
    depends_on:
      - registry
    volumes:
      - ./registry-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.local/registry.crt:/etc/nginx/certs/registry.crt:ro
      - ./.local/registry.key:/etc/nginx/certs/registry.key:ro
    restart: unless-stopped

  runner:
    image: docker.io/gitea/act_runner:0.2.13
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN:?Run scripts/up.sh first}
      GITEA_RUNNER_NAME: local-runner
      CONFIG_FILE: /config.yaml
    volumes:
      - runner-data:/data
      - ./runner.yaml:/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - local
    restart: unless-stopped

networks:
  local:
    external: true
    name: full-auto

volumes:
  gitea-data:
  registry-data:
  runner-data:
